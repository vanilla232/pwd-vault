name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install dependencies
        run: npm install

      - name: Init Android Project
        run: npx tauri android init

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > upload-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=../../../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Patch build.gradle.kts
        run: |
          python -c "
          import re
          path = 'src-tauri/gen/android/app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()

          # Вставляем импорт
          if 'import java.io.FileInputStream' not in content:
              content = 'import java.io.FileInputStream\n' + content

          # Вставляем загрузку keystoreProperties перед блоком android
          keystore_load = '''
val keystorePropertiesFile = rootProject.file(\"keystore.properties\")
val keystoreProperties = java.util.Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
}
'''
          content = content.replace('android {', keystore_load + '\nandroid {', 1)

          signing_configs = '''
    signingConfigs {
        create(\"release\") {
            keyAlias = keystoreProperties[\"keyAlias\"] as String
            keyPassword = keystoreProperties[\"keyPassword\"] as String
            storeFile = file(keystoreProperties[\"storeFile\"] as String)
            storePassword = keystoreProperties[\"storePassword\"] as String
        }
    }
'''
          content = content.replace('buildTypes {', signing_configs + '\nbuildTypes {', 1)

          # Применяем подпись внутри блока release
          content = content.replace('isMinifyEnabled = false', 'isMinifyEnabled = false\n            signingConfig = signingConfigs.getByName(\"release\")', 1)

          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build APK
        run: npx tauri android build --apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk